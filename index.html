Il n’y eut pas de grand discours. Seulement un regard. Une question silencieuse. Une réponse tout aussi claire. Dans sa chambre, la lumière était tamisée. Ils se déshabillèrent sans précipitation, en se regardant. Il y avait de la pudeur, oui, mais une pudeur joyeuse, presque reconnaissante. Lorsqu’ils se retrouvèrent peau contre peau, Jamila eut un petit souffle, comme une surprise heureuse. Salim l’embrassa longuement, le front, les tempes, la bouche, comme s’il voulait apprendre par cœur la carte de son visage.

Leur étreinte fut tendre et sensuelle à la fois. Rien de mécanique. Rien de performatif. Seulement deux corps qui avaient appris à se faire confiance et qui pouvaient enfin s’abandonner à ce qu’ils désiraient depuis des semaines. Elle le guida parfois. Il la suivit. Ils rirent une fois, tout bas, d’un malentendu charmant. Puis le rire se perdit dans un autre baiser.

Après, ils restèrent longtemps enlacés. La respiration encore un peu rapide. Les doigts entrelacés. Dehors, Casablanca continuait sa nuit. À l’intérieur, tout était calme.

— Je ne savais pas que ça pouvait être… comme ça, murmura-t-elle contre son épaule.

— Comme quoi ?

— Aussi simple. Et aussi profond en même temps.

Il pressa ses lèvres contre ses cheveux.

— Moi non plus.

Dans les jours qui suivirent, quelque chose s’était définitivement ouvert. Ils se disaient plus clairement ce qu’ils ressentaient. Pas encore les grands mots définitifs, mais des phrases justes, posées avec soin. « J’ai pensé à toi toute la journée. » « Ta voix me manque quand tu es à Fès. » « Je suis heureuse, là, maintenant. »

Un après-midi, alors qu’ils marchaient le long de la mer, Jamila s’arrêta et le regarda.

— Tu sais que je suis en train de t’aimer, n’est-ce pas ?

La phrase était simple. Presque factuelle. Et pourtant elle fit battre le cœur de Salim avec une force qu’il n’avait pas ressentie depuis longtemps.

— Oui, répondit-il. Et tu sais que c’est réciproque.

Elle sourit. Un sourire large, libre, sans défense.

— Oui. Je sais.

Ils reprirent leur marche. Leurs mains se trouvèrent. Cette fois, il n’y avait plus de « pas encore ». Il n’y avait plus de distance à mesurer. Seulement deux êtres qui avaient pris le temps d’apprendre à se connaître, à se craindre, à se choisir, et qui pouvaient enfin laisser la rose s’ouvrir tout à fait.

Elle s’ouvrit. Non pas dans un éclat brutal. Mais dans la plénitude tranquille de ce qui a été patient. Ses pétales, un à un, s’étaient écartés. Le cœur de la fleur était maintenant visible. Et sa beauté venait autant du temps qu’elle avait mis à s’épanouir que de l’éclat présent de sa floraison.`;
addCh(10,'La rose s’ouvre',PART10);
const PART11=`L’hiver s’installa sur Casablanca avec une douceur trompeuse. Les journées restaient claires, mais les soirs descendaient plus tôt. Dans cet entre-deux, la relation de Salim et de Jamila trouva une assise nouvelle. Ils n’étaient plus deux personnes qui s’apprivoisaient. Ils étaient deux êtres qui s’étaient choisis, et qui apprenaient maintenant ce que ce choix impliquait au quotidien.

Ils se voyaient plusieurs fois par semaine. Parfois chez lui, parfois chez elle. Parfois simplement pour marcher le long de la mer, main dans la main, en parlant de choses ordinaires. Le désir n’avait pas faibli. Il s’était seulement installé dans une familiarité plus profonde. Ils connaissaient maintenant le corps de l’autre. Ses réactions. Ses silences. Ses élans. Et cette connaissance, loin d’émousser le trouble, l’avait rendu plus précis, plus tendre.

Un soir, alors qu’ils étaient allongés dans le lit de Salim, Jamila traça du doigt une cicatrice discrète sur son épaule.

— Je ne l’avais jamais remarquée.

— Chute d’échelle. Il y a longtemps. Sur un chantier.

Elle sourit contre sa peau.

— Tu collectionnes les preuves que tu as vécu.

— Et toi, tu collectionnes les images de ce qui reste. On est bien assortis.

Ils rirent tout bas. Puis le rire se perdit dans un baiser. Plus tard, alors qu’elle s’endormait contre lui, Salim resta éveillé un moment, conscient de la rareté de ce qu’il tenait. Non pas une passion aveugle. Quelque chose de plus solide. Un amour qui avait appris à regarder en face les failles de l’autre sans chercher à les corriger.

Ce fut au début du mois de janvier que l’épreuve arriva.

Salim reçut un appel de Paris. Un ancien collaborateur lui proposait de diriger la restauration d’un important riad-palais transformé en maison d’hôtes de prestige, à Marrakech d’abord, puis éventuellement un second projet en Andalousie. Le contrat était de huit mois minimum. Peut-être plus. Le salaire, les moyens, la reconnaissance professionnelle : tout était au rendez-vous. C’était, objectivement, une belle opportunité.

Il en parla à Jamila le soir même, chez elle.

Ils étaient assis à sa petite table de cuisine. Elle l’écouta jusqu’au bout, sans l’interrompre. Puis elle posa sa tasse.

— Et tu veux y aller ?

La question était simple. Elle n’était pas accusatrice. Elle demandait simplement la vérité.

— Une partie de moi oui, répondit-il honnêtement. C’est un beau projet. Et ça fait longtemps que je n’ai pas eu un chantier de cette ampleur. Mais l’autre partie… l’autre partie pense à toi. À nous. À ce que huit mois de distance signifieraient.

Jamila regarda un moment par la fenêtre. Les lumières de Maârif scintillaient.

— Je ne te demanderai jamais de renoncer à quelque chose d’important pour moi, dit-elle finalement. Je sais ce que c’est de construire une vie autour de son travail. Je ne veux pas devenir celle qui retient.

— Et moi, je ne veux pas devenir celui qui part en te laissant gérer seule le vide.

Ils se turent. Le problème était là, posé entre eux, sans artifice. Pas une trahison. Pas un drame. Juste la réalité d’une décision qui allait tester la solidité de ce qu’ils avaient bâti.

Dans les jours qui suivirent, ils en parlèrent plusieurs fois. Avec calme. Avec précision. Parfois avec une pointe d’inquiétude qu’ils ne cherchaient plus à dissimuler. Jamila lui dit qu’elle avait peur de la distance. Non pas par manque de confiance, mais parce qu’elle savait combien les absences prolongées pouvaient éroder même les liens solides. Salim lui dit qu’il avait peur, lui aussi. Peur de regretter d’être parti. Peur de regretter de rester. Peur, surtout, de la blesser quoi qu’il décide.

Un dimanche après-midi, ils allèrent jusqu’à la corniche. Le vent était fort. Ils marchèrent longtemps sans parler. Puis Jamila s’arrêta et se tourna vers lui.

— Est-ce que tu m’aimes assez pour partir sans que ça nous détruise ? demanda-t-elle. Et est-ce que je t’aime assez pour te laisser partir sans te faire porter le poids de ma peur ?

Salim la regarda. Le vent soulevait ses cheveux. Ses yeux étaient clairs, exigeants, tendres.

— Oui, répondit-il. Aux deux questions. Mais je ne veux pas décider seul. Parce que ce n’est plus seulement ma vie. C’est la nôtre.

Elle prit sa main.

— Alors on décide ensemble. Même si la décision est difficile.

Ils passèrent la semaine suivante à peser. Salim téléphona à son associé, à l’ancien collaborateur, à un ami architecte qui avait vécu une situation semblable. Jamila, de son côté, avança sur son livre, accepta un reportage à Rabat, et passa une soirée entière à écrire dans son carnet tout ce qu’elle n’osait pas encore formuler à voix haute.

Un soir, elle arriva chez lui avec une proposition claire.

— Si tu acceptes, dit-elle, on organise les choses. Tu pars pour les premiers mois. On se voit dès que possible. Je viens à Marrakech quand je peux. Tu reviens dès que le chantier le permet. Et on évalue. Ensemble. Au bout de trois mois. Si la distance nous abîme, on ajuste. Si elle tient, on continue. Mais on ne fait pas semblant que ce sera facile. Et on ne fait pas non plus semblant que l’amour doit tout sacrifier pour prouver sa force.

Salim l’écouta en silence. Puis il s’approcha et l’embrassa longuement.

— Tu es en train de me montrer ce que j’espérais trouver sans savoir le nommer, dit-il contre ses lèvres. Un amour qui ne me demande pas de me renier. Et qui ne se renie pas non plus.

Elle sourit.

— C’est exactement ça. On ne se sauve pas l’un l’autre. On se choisit. Encore. Même quand c’est compliqué.

Ils passèrent la nuit ensemble. Il y eut de la sensualité, oui. Une étreinte plus intense que d’habitude, comme si leurs corps avaient besoin de se rappeler l’un à l’autre avant l’éventuelle distance. Mais il y eut aussi beaucoup de paroles. Des projets. Des peurs avouées. Des rires. À un moment, Jamila se moqua gentiment de la façon dont il pliait ses chemises. Il rétorqua qu’elle laissait toujours ses carnets ouverts un peu partout. Ils rirent. Puis ils se turent, enlacés, conscients que l’amour mature n’était pas l’absence de difficultés. C’était la capacité de les traverser sans se mentir.

Au matin, Salim appela Paris.

Il accepta le projet. Pour six mois d’abord. Avec la possibilité de revenir plus souvent que prévu. Et surtout, avec la certitude que la décision avait été prise à deux.

Lorsqu’il raccrocha, Jamila était derrière lui. Elle passa ses bras autour de sa taille et posa son front entre ses omoplates.

— On va y arriver, murmura-t-elle.

— Oui. Parce qu’on a déjà appris le plus difficile : rester vrais l’un avec l’autre.

Dehors, le soleil d’hiver entrait par la fenêtre. À l’intérieur, deux êtres qui s’étaient rencontrés par hasard dans un train tenaient maintenant entre leurs mains quelque chose de rare : un amour assez solide pour affronter le réel, assez souple pour ne pas se briser, et assez conscient pour savoir que le plus beau n’était pas d’éviter les épreuves, mais de les traverser ensemble.

La rose était pleinement ouverte. Ses pétales ne tremblaient plus. Ils savaient désormais supporter le vent.`;
addCh(11,'Le grand amour',PART11);
const PART12=`Six mois plus tard, le train ralentit en approchant de Casa-Voyageurs.

Salim était debout dans le couloir depuis plusieurs minutes déjà. Il n’avait pas réussi à rester assis. Par la vitre, il reconnaissait les mêmes hangars, les mêmes terrains vagues, les mêmes immeubles bas qu’il avait vus, un an plus tôt, en sens inverse. Seulement, cette fois, il ne rentrait pas d’un simple chantier. Il rentrait d’une absence choisie, traversée, et tenue.

Sur le quai, Jamila attendait.

Elle portait la même robe couleur terre cuite que le jour de leur première rencontre. Pas par calcul. Parce qu’elle l’avait retrouvée au fond d’une armoire en rangeant, et que quelque chose en elle avait simplement décidé que c’était le bon jour pour la remettre. Ses cheveux étaient relevés, imparfaits, comme toujours. Dans ses mains, elle tenait un petit bouquet de roses. Cette fois, elles étaient ouvertes.

Lorsqu’il descendit, leurs regards se trouvèrent immédiatement. Il n’y eut pas de course. Pas de scène. Seulement deux personnes qui s’étaient attendues l’une l’autre assez longtemps pour ne plus avoir besoin de prouver quoi que ce soit. Elle avança. Il avança. Et lorsqu’ils se prirent dans les bras, ce fut avec la simplicité de ceux qui savent enfin où est leur place.

— Tu es là, murmura-t-elle contre son épaule.

— Je suis là.

Ils restèrent ainsi un long moment, au milieu du flux des voyageurs, indifférents aux regards. Puis elle se recula juste assez pour lui montrer les roses.

— Elles sont complètement ouvertes, cette fois.

Il sourit.

— Ça leur a pris du temps.

— Oui. Mais elles y sont arrivées.

Ils quittèrent la gare ensemble. Dehors, Casablanca était baignée d’une lumière de fin d’après-midi, la même lumière ambrée qui avait un jour traversé les vitres d’un wagon entre deux villes. Rien n’avait changé. Et pourtant, tout était différent.

Dans les mois qui avaient précédé, ils avaient tenu leur pari. Salim avait travaillé à Marrakech. Jamila était venue le rejoindre trois fois. Lui était remonté à Casablanca autant que le chantier le permettait. Ils avaient parlé, parfois avec difficulté, parfois avec une facilité retrouvée. Ils avaient douté. Ils avaient manqué l’un de l’autre. Et à chaque fois, ils avaient choisi de ne pas laisser le manque décider à leur place. Au bout de trois mois, lors de leur évaluation promise, ils s’étaient regardés dans un petit café de la place Jemaa el-Fna et avaient simplement dit : « On continue. » Sans fanfare. Avec la certitude tranquille de ceux qui ont vérifié.

Maintenant, le projet était terminé. Salim rentrait pour de bon. Et quelque chose d’autre commençait.

Ils dînèrent ce soir-là chez elle. Sur la table, les roses ouvertes. Autour d’eux, l’appartement de Maârif qui, peu à peu, avait aussi pris des allures de chez lui : un livre oublié, une chemise accrochée, un mug qu’il préférait. Après le repas, ils s’installèrent sur le canapé. La conversation glissa naturellement vers l’avenir.

— Je ne veux plus de solutions provisoires, dit finalement Salim. Ni de demi-mesures. Je veux qu’on construise quelque chose de clair. Ensemble.

Jamila le regarda. Il n’y avait plus de peur dans ses yeux. Seulement une attention profonde.

— Qu’est-ce que tu proposes ?

— Que tu viennes vivre avec moi. Ou que je vienne ici. Ou qu’on trouve un endroit qui soit vraiment le nôtre. Peu importe la forme. Ce qui compte, c’est qu’on arrête de faire comme si nos vies étaient encore parallèles. Elles ne le sont plus.

Elle prit le temps de répondre. Non par hésitation. Par respect pour le poids des mots.

— Oui, dit-elle. Je veux ça. Un endroit à nous. Une vie où l’on ne se quitte plus seulement pour des raisons professionnelles. Où l’on se choisit aussi dans les matins ordinaires. Dans les courses. Dans les silences. Dans tout ce qui n’a rien de spectaculaire.

Il lui prit la main.

— Tu te souviens de ce que tu m’as dit dans le train, la première fois ? Que les choses qui ne sont pas spectaculaires sont souvent les plus intéressantes.

Elle sourit.

— Je m’en souviens. Et je sais maintenant que c’est vrai aussi pour l’amour.

Ils restèrent longtemps ainsi, mains jointes, le silence de nouveau plein, mais d’une plénitude différente. Plus tard, ils s’embrassèrent. Lentement. Avec cette connaissance intime de l’autre qui rend chaque geste à la fois familier et toujours nouveau. Puis ils se couchèrent. Non pas pour fuir le monde. Pour l’habiter autrement.

Dans les semaines qui suivirent, ils trouvèrent un appartement. Ni tout à fait Anfa, ni tout à fait Maârif. Quelque part entre les deux, avec une terrasse assez grande pour des plantes et une vue lointaine sur la mer. Ils emménagèrent sans précipitation. Chaque objet trouva sa place. Chaque habitude s’ajusta à l’autre. Il y eut des accrochages mineurs — la façon de ranger, le volume de la musique, les horaires de travail — et chaque fois, ils parlèrent. Parce qu’ils avaient appris que le silence, s’il n’était pas choisi, pouvait redevenir une distance.

Un dimanche matin, plusieurs mois plus tard, ils prirent le train.

Pas pour une obligation. Pour le plaisir. Direction Rabat, simplement. Une journée. Des rues à marcher. Un déjeuner. Le bruit des rails sous leurs pieds.

Dans le wagon, ils s’installèrent côté fenêtre, l’un en face de l’autre. Exactement comme la première fois. Jamila sortit un carnet. Salim sortit un livre qu’il n’avait, une fois encore, pas vraiment l’intention de lire. Dehors, les paysages défilaient. Oliviers. Collines. Lumière.

À un moment, elle leva les yeux et le regarda.

— Tu te souviens ?

Il n’eut pas besoin de demander de quoi.

— Oui. Tu écrivais. Moi, je faisais semblant de lire. Et quelque chose a commencé sans qu’on le sache.

Elle pencha la tête.

— Est-ce que tu crois au destin ?

Il réfléchit.

— Je crois aux rencontres. Et je crois qu’on a le choix de ce qu’on en fait ensuite. Le train nous a mis l’un en face de l’autre. Mais c’est nous qui avons décidé de ne pas descendre trop vite. De rester. De parler. De douter. De revenir. De s’ouvrir.

Elle sourit.

— Comme une rose.

— Comme une rose.

Ils se turent. Le train avançait. Autour d’eux, d’autres voyageurs parlaient, dormaient, regardaient par la fenêtre. Des vies qui se croisaient, le temps d’un trajet. Certaines resteraient des parenthèses. D’autres, peut-être, deviendraient des histoires. On ne pouvait jamais savoir à l’avance.

Salim tendit la main. Jamila y posa la sienne. Leurs doigts s’entrelacèrent avec la facilité des gestes devenus nécessaires. Dehors, le paysage changeait. À l’intérieur, plus rien n’était en suspens.

La rose avait fleuri. Non pas en un instant de grâce. Mais au fil des jours, des silences, des peurs traversées, des corps appris, des mots justes, des retours choisis. Elle avait tenu sous le vent. Elle avait attendu la lumière. Et maintenant, pleinement ouverte, elle n’avait plus besoin de prouver sa beauté. Elle existait. Simplement. Fortement. À sa place.

Le train continua sa route. Et quelque part, entre deux gares, deux êtres qui s’étaient un jour rencontrés par hasard savaient enfin que le véritable voyage n’était pas celui des rails. C’était celui qu’ils avaient accepté de faire l’un vers l’autre. Lentement. Courageusement. Jusqu’au bout.`;

/* Import : repère « PARTIE X — TITRE » dans les fichiers .txt/.md */
function parse(txt){
  const out={},H=/^[#*\s]*PARTIE\s+([IVXLC]+)\s*[—–-]\s*(.+?)[*\s]*$/i;let k=null;
  for(let l of txt.split(/\r?\n/)){
    const m=l.match(H);
    if(m){k=rn(m[1].toUpperCase());let t=m[2].replace(/\*+/g,'').replace(/\s*LES ROSES DU DESTIN\s*$/i,'').trim();out[k]={title:t.charAt(0)+t.slice(1).toLowerCase(),text:''};continue}
    if(!k||/^[#*\s]*LES ROSES DU DESTIN[*\s]*$/i.test(l)||/^\s*-{3,}\s*$/.test(l))continue;
    if(/^\*[^*].*\*$/.test(l.trim())&&!out[k].text)continue;
    out[k].text+=l+'\n';
  }
  /* Cas d’un fichier où la partie II suit la I sans titre : on la sépare */
  const cut=out[1]&&out[1].text.indexOf('Le train n’avait pas encore repris');
  if(out[2]&&!out[2].text.trim()&&cut>0){out[2].text=out[1].text.slice(cut);out[1].text=out[1].text.slice(0,cut)}
  return out;
}

  $('impMsg').textContent=n?n+' chapitre(s) importé(s). Total : '+CH.length+'.':'Aucun titre « PARTIE … — … » trouvé.';
  e.target.value='';buildToc();if(cur>=0)show(cur);
};

function buildToc(){
  $('tocList').innerHTML='';
  CH.forEach((c,i)=>{const b=document.createElement('button');b.className='toc-i'+(i===cur?' cur':'');
    const s=document.createElement('small');s.textContent='Partie '+c.n;b.append(s,c.title);
    b.onclick=()=>{show(i);closeAll()};$('tocList').append(b)});
}
function show(i){
  setAuto(false);cur=i;const c=CH[i];$('cover').style.display='none';$('read').style.display='block';
  const pg=$('page');pg.innerHTML='';
  const a=document.createElement('p');a.className='pn';a.textContent='Partie '+c.n;
  const h=document.createElement('h3');h.textContent=c.title;pg.append(a,h);
  c.text.split(/\n\s*\n/).forEach((t,j)=>{t=t.trim();if(!t)return;const p=document.createElement('p');p.textContent=t;
    if(j===0)p.className='first';else if(/^[—–-]\s/.test(t))p.className='dlg';pg.append(p)});
  $('prev').style.visibility=i>0?'visible':'hidden';$('next').style.visibility=i<CH.length-1?'visible':'hidden';
  buildToc();apply();window.scrollTo(0,0);prog();
  try{localStorage.setItem('rdt-cur',i)}catch(e){}
}

let auto=false,last=0,acc=0;
function tick(t){if(!auto)return;const dt=Math.min(t-last,100)/1000;last=t;acc+=S.sp*dt;const n=Math.floor(acc);if(n){scrollBy(0,n);acc-=n}
 if(innerHeight+scrollY>=document.documentElement.scrollHeight-2){setAuto(false);return}requestAnimationFrame(tick)}
function setAuto(v){auto=!!v&&cur>=0;$('bPlay').textContent=auto?'⏸':'▶';$('bPlay').classList.toggle('on',auto);if(auto){last=performance.now();acc=0;requestAnimationFrame(tick)}}

['wheel','touchmove'].forEach(ev=>addEventListener(ev,e=>{if(auto&&!e.target.closest('.panel'))setAuto(false)},{passive:true}));
